<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172638">
  <title>漫画人物测试 · 发码管理</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header><a href="index.html">← 返回人物测试</a><span>发码管理</span></header>
  <main>
    <div class="heading"><p class="eyebrow">漫画人物测试 / 管理后台</p><h1>兑换码与交付</h1><p>按作品生成与管理兑换码，人工发送测试链接和兑换码。</p></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="login-section" class="panel">
      <h2>管理员登录</h2>
      <form id="login-form" method="post">
        <label>邮箱<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" disabled>登录后台</button>
      </form>
    </section>
    <section id="dashboard" hidden>
      <div class="toolbar"><p id="account"></p><button id="logout" class="secondary">退出登录</button></div>
      <section class="panel">
        <h2>生成新批次</h2>
        <form id="batch-form" class="batch-form">
          <label>漫画作品<select id="work-id" name="workId"></select></label>
          <label>兑换码数量<input id="count" name="count" type="number" min="1" max="1000" value="100" required></label>
          <label>批次备注<input id="note" name="note" maxlength="200" placeholder="例如：火影 · 首轮体验"></label>
          <button type="submit">生成兑换码</button>
        </form>
        <p class="muted">每码可成功生成3份结果。创建后可多次下载CSV；原码仅向管理员提供。</p>
      </section>
      <section class="panel">
        <div class="section-head"><h2>发码批次</h2><button id="refresh" class="secondary">刷新</button></div>
        <div id="batches" class="batch-list"></div>
      </section>
      <section id="codes-panel" class="panel" hidden>
        <div class="section-head"><h2>批次中的兑换码</h2><button id="export" class="secondary">导出本批CSV</button></div>
        <p id="batch-detail" class="muted"></p>
        <div class="table-wrap"><table><thead><tr><th>兑换码</th><th>已用 / 总次数</th><th>状态</th><th>操作</th></tr></thead><tbody id="codes"></tbody></table></div>
      </section>
      <section class="panel muted"><h2>人工交付</h2><p>将测试入口和对应漫画的兑换码发送给买家。CSV包含完整有效码，请妥善保管。停用后不能生成新结果，已经生成的结果会保留。</p></section>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
